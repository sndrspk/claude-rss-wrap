name: Wrap

on:
  schedule:
    # GitHub cron is always UTC. The sweep runs every 30 minutes; which wraps
    # actually run is decided per tag by wrap.py from each tag's schedule.days
    # and optional schedule.time in config.yml (default 05:30 UTC, the time
    # this cron used to fire at when it swept only once a day). A tag runs at
    # the first sweep at or after its time, at most once per day. Sweeps with
    # nothing due exit before touching Feedbin, so they are cheap.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
    inputs:
      only_tags:
        description: >-
          Comma-separated tag names to run, bypassing the schedule
          (e.g. "Wrap: News"). Leave empty to run whatever is due today.
        required: false
        default: ""

permissions:
  contents: write           # needed to commit the regenerated feed

concurrency:
  group: wrap
  cancel-in-progress: false

jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the wrap
        env:
          FEEDBIN_EMAIL: ${{ secrets.FEEDBIN_EMAIL }}
          FEEDBIN_PASSWORD: ${{ secrets.FEEDBIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ONLY_TAGS: ${{ inputs.only_tags }}
        run: python wrap.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ state.json
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Wrap: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
